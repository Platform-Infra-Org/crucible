apiVersion: apps/v1
kind: Deployment
metadata:
  name: forge
  labels: {app: forge}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: {app: forge}
  template:
    metadata:
      labels: {app: forge}
    spec:
      containers:
        - name: web
          image: {{ .Values.image }}
          ports: [{containerPort: 80}]
          readinessProbe:
            httpGet: {path: /, port: 80}
