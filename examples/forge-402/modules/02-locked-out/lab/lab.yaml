id: locked-out
runtime: aws
ttl: 2h
idle_timeout: 45m
task_order: free
terminals:
  - { name: workspace, service: workspace }
tasks:
  - id: t1-let-in
    instructions: tasks/01-let-in.md
    check: { script: checks/01-let-in.sh, run_in: workspace, timeout: 120s }
    points: 3
aws:
  region: eu-west-1
  max_hourly_usd: 0.05
  direct_ssh: true
