image:
  repository: docker.io/library/crucible   # imported into containerd from the S3 release tarball
  tag: dev
  pullPolicy: Never
host: crucible.example.com
publicURL: https://crucible.example.com
platformBranch: main
syncInterval: 60s
gitBot:                       # author of config commits the UI pushes; use an address your git host accepts
  name: Crucible Bot
  email: crucible-bot@example.com
oidc:
  issuer: ""
  clientId: crucible
secretName: crucible-secrets
tls:
  certResolver: le
postgres:
  image: postgres:18-alpine
  storage: 10Gi
backup:
  bucket: ""
  region: ""
  schedule: "15 19 * * *"
  timeZone: Europe/Bucharest
clusterLabs:
  enabled: true            # runtime: cluster labs; nodes need the sysbox-runc RuntimeClass (docs/runbooks/aws.md)
  unsafePrivileged: false  # dev clusters without sysbox only (kind): privileged lab pods. Never in production
  iUnderstandPrivilegedLabsAreUnsafe: false  # must also be true to render unsafePrivileged
awsLabs:
  enabled: false            # runtime: aws labs; needs clusterLabs.enabled and the deploy/aws/labs stack (docs/runbooks/aws.md)
  dryRun: false             # CRUCIBLE_AWS_LABS=dryrun: no AWS, a fake lab account, role ARNs not needed. Development only
  labRoleArn: ""            # deploy/aws/labs outputs; `crucible aws up` fills these in
  opsRoleArn: ""
  stateBucket: ""
  stateRegion: ""           # default: backup.region
  regions: eu-west-1        # comma-separated; must match the labs stack's allowed_regions
  workspaceImage: amazon/aws-cli:2.27.0
  terraformImage: hashicorp/terraform:1.16.5
