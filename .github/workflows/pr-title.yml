# The PR title gate runs on every PR, docs-only ones included (checks.yml skips those).
name: pr-title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  # Conventional-commit gate: with squash-merge the PR *title* is the commit
  # git-cliff parses, so it must be a valid conventional-commit subject.
  pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
