{{- if and .Values.clusterLabs.unsafePrivileged (not .Values.clusterLabs.iUnderstandPrivilegedLabsAreUnsafe) }}
{{- fail "clusterLabs.unsafePrivileged runs lab pods privileged (dev/kind only). Also set clusterLabs.iUnderstandPrivilegedLabsAreUnsafe=true to confirm." }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata: { name: crucible, namespace: {{ .Release.Namespace }} }
automountServiceAccountToken: false   # the Deployment opts in only when Crucible's lab cluster is on (AWS lab workspaces)
{{- if .Values.clusterLabs.enabled }}
---
# What the AWS lab workspace runner does on Crucible's own cluster (internal/labs/cluster.go). RBAC cannot be scoped by namespace label, so the
# ValidatingAdmissionPolicy below confines every write to lab-<id> namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: crucible-labs }
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [list, create, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, create{{ if .Values.awsLabs.enabled }}, delete{{ end }}]   # no list: a cluster-wide list would expose every pod's env, and admission can't gate reads
    # aws labs: delete stops a running terraform apply before destroy
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [get, create]          # WebSocket exec authorizes get (and create on newer API servers); SPDY uses create
  - apiGroups: [""]
    resources: [resourcequotas, limitranges]
    verbs: [create]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [create]
  {{- if .Values.awsLabs.enabled }}
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, update]       # aws labs: write the lab's credentials file; Crucible can never read a secret back
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create]               # aws labs: the terraform module
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: crucible-labs }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: crucible-labs }
subjects:
  - { kind: ServiceAccount, name: crucible, namespace: {{ .Release.Namespace }} }
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: { name: crucible-labs-only }
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - { apiGroups: [""], apiVersions: [v1], operations: [CREATE, DELETE], resources: [namespaces] }
      - { apiGroups: [""], apiVersions: [v1], operations: [CREATE], resources: [pods, resourcequotas, limitranges] }
      - { apiGroups: [""], apiVersions: [v1], operations: [CONNECT], resources: [pods/exec] }
      - { apiGroups: [networking.k8s.io], apiVersions: [v1], operations: [CREATE], resources: [networkpolicies] }
      {{- if .Values.awsLabs.enabled }}
      - { apiGroups: [""], apiVersions: [v1], operations: [CREATE, UPDATE], resources: [secrets] }
      - { apiGroups: [""], apiVersions: [v1], operations: [CREATE], resources: [configmaps] }
      - { apiGroups: [""], apiVersions: [v1], operations: [DELETE], resources: [pods, secrets, configmaps] }
      {{- end }}
  matchConditions:
    - name: crucible-api-only
      expression: "request.userInfo.username == 'system:serviceaccount:{{ .Release.Namespace }}:crucible'"
  variables:
    - name: target
      expression: "request.operation == 'CREATE' ? object : oldObject"
  validations:
    - expression: >-
        request.resource.resource != 'namespaces' ||
        (variables.target.metadata.name.startsWith('lab-') && has(variables.target.metadata.labels) &&
         'crucible.io/lab' in variables.target.metadata.labels)
        {{- if .Values.awsLabs.enabled }} ||
        (request.operation == 'CREATE' && object.metadata.name == 'crucible-estimates' && has(object.metadata.labels) &&
         'crucible.io/lab' in object.metadata.labels && object.metadata.labels['crucible.io/lab'] == 'estimates')
        {{- end }}
      message: crucible-api may only create and delete lab-<id> namespaces{{ if .Values.awsLabs.enabled }} (and create crucible-estimates){{ end }}
    - expression: >-
        request.resource.resource == 'namespaces' ||
        (namespaceObject != null &&
         (namespaceObject.metadata.name.startsWith('lab-'){{ if .Values.awsLabs.enabled }} || namespaceObject.metadata.name == 'crucible-estimates'{{ end }}) &&
         has(namespaceObject.metadata.labels) && 'crucible.io/lab' in namespaceObject.metadata.labels)
      message: crucible-api may only create lab pods, policies and terminals inside lab namespaces{{ if .Values.awsLabs.enabled }} (and run estimates in crucible-estimates){{ end }}
    {{- if not .Values.clusterLabs.unsafePrivileged }}
    - expression: >-
        request.resource.resource != 'namespaces' || request.operation != 'CREATE' ||
        (has(object.metadata.labels) && 'pod-security.kubernetes.io/enforce' in object.metadata.labels &&
         object.metadata.labels['pod-security.kubernetes.io/enforce'] == 'baseline')
      message: lab namespaces must enforce Pod Security "baseline" (no privileged lab pods)
    {{- end }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: { name: crucible-labs-only }
spec:
  policyName: crucible-labs-only
  validationActions: [Deny]
{{- if .Values.awsLabs.enabled }}
---
# Estimates (internal/labs aws.go Plan): one-shot terraform plan pods, each with its own credentials secret and module
# config map, in this namespace only. Labelled like estimatesObjects (crucible.io/lab=estimates, never a lab id, and
# Pod Security baseline); the Go code also creates it on first use and tolerates it existing.
apiVersion: v1
kind: Namespace
metadata:
  name: crucible-estimates
  labels:
    crucible.io/lab: estimates
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: crucible-estimates, namespace: crucible-estimates }
rules:
  - apiGroups: [""]
    resources: [pods, secrets, configmaps]
    verbs: [create, get, list, watch, delete]   # a plan run's pod, credentials and module; the sweep lists and reaps leftovers
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]                                # the plan JSON is the pod log's last line
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [create]                             # the namespace's egress policy (DNS and the public internet only)
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: crucible-estimates, namespace: crucible-estimates }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: crucible-estimates }
subjects:
  - { kind: ServiceAccount, name: crucible, namespace: {{ .Release.Namespace }} }
{{- end }}
{{- end }}
