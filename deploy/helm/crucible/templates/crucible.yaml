apiVersion: apps/v1
kind: Deployment
metadata: { name: crucible }
spec:
  replicas: 1                 # ponytail: one process holds the agent hub; scale out needs a shared hub (later)
  strategy: { type: Recreate }
  selector: { matchLabels: { app: crucible } }
  template:
    metadata: { labels: { app: crucible } }
    spec:
      serviceAccountName: crucible
      automountServiceAccountToken: {{ .Values.clusterLabs.enabled }}
      initContainers:
        - name: restore
          image: {{ .Values.postgres.image }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              until pg_isready -h postgres -U crucible; do sleep 2; done
              inited=$(psql -h postgres -U crucible -d crucible -tAc "select to_regclass('public.users') is not null")
              if [ "$inited" = "t" ]; then
                echo "database already initialised; no restore"; exit 0
              fi
              apk add --no-cache aws-cli >/dev/null
              latest=$(aws s3api list-objects-v2 --bucket "{{ .Values.backup.bucket }}" --prefix snapshots/crucible- --query 'max_by(Contents || `[]`, &Key).Key' --output text)
              if [ "$latest" = "None" ]; then
                if aws s3api head-object --bucket "{{ .Values.backup.bucket }}" --key latest/crucible-latest.dump >/dev/null 2>/tmp/head.err; then
                  latest=latest/crucible-latest.dump
                elif grep -qE '\(404\)|Not Found' /tmp/head.err; then
                  echo "no snapshot found: fresh install"; exit 0
                else
                  cat /tmp/head.err >&2; exit 1
                fi
              fi
              aws s3 cp "s3://{{ .Values.backup.bucket }}/$latest" /tmp/db.dump
              pg_restore -h postgres -U crucible -d crucible --no-owner --single-transaction --exit-on-error /tmp/db.dump
              echo "restored $latest"
          env:
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: POSTGRES_PASSWORD } }
            - { name: AWS_REGION, value: {{ .Values.backup.region | quote }} }
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { cpu: 250m, memory: 512Mi } } # Guaranteed QoS
          ports: [{ containerPort: 8080 }]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: POSTGRES_PASSWORD } }
            - { name: DATABASE_URL, value: "postgres://crucible:$(POSTGRES_PASSWORD)@postgres:5432/crucible?sslmode=disable" }
            - name: CRUCIBLE_PLATFORM_REPO
              valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: CRUCIBLE_PLATFORM_REPO } }
            - { name: CRUCIBLE_PLATFORM_BRANCH, value: {{ .Values.platformBranch | quote }} }
            - { name: CRUCIBLE_PUBLIC_URL, value: {{ .Values.publicURL | quote }} }
            - { name: CRUCIBLE_SYNC_INTERVAL, value: {{ .Values.syncInterval | quote }} }
            - { name: CRUCIBLE_GIT_BOT_NAME, value: {{ .Values.gitBot.name | quote }} }
            - { name: CRUCIBLE_GIT_BOT_EMAIL, value: {{ .Values.gitBot.email | quote }} }
            - name: CRUCIBLE_GIT_HOOK_SECRET
              valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: CRUCIBLE_GIT_HOOK_SECRET } }
            - name: CRUCIBLE_QUIZ_SECRET
              valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: CRUCIBLE_QUIZ_SECRET } }
            - { name: CRUCIBLE_BLOB_BUCKET, value: {{ .Values.backup.bucket | quote }} }   # uploads/ and transcripts (M5)
            - { name: CRUCIBLE_BLOB_REGION, value: {{ .Values.backup.region | quote }} }
            - { name: OIDC_ISSUER, value: {{ .Values.oidc.issuer | quote }} }
            - { name: OIDC_CLIENT_ID, value: {{ .Values.oidc.clientId | quote }} }
            - name: OIDC_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: OIDC_CLIENT_SECRET } }
            - name: CRUCIBLE_SMTP_ADDR
              valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: CRUCIBLE_SMTP_ADDR, optional: true } }
            - name: CRUCIBLE_SMTP_FROM
              valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: CRUCIBLE_SMTP_FROM, optional: true } }
            - name: CRUCIBLE_SMTP_USERNAME
              valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: CRUCIBLE_SMTP_USERNAME, optional: true } }
            - name: CRUCIBLE_SMTP_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: CRUCIBLE_SMTP_PASSWORD, optional: true } }
            {{- if .Values.clusterLabs.enabled }}
            - { name: CRUCIBLE_CLUSTER_LABS, value: "1" }
            {{- if .Values.clusterLabs.unsafePrivileged }}
            - { name: CRUCIBLE_CLUSTER_PRIVILEGED, value: "1" }
            {{- end }}
            {{- end }}
            {{- if .Values.awsLabs.enabled }}
            {{- if not .Values.clusterLabs.enabled }}{{ fail "awsLabs.enabled needs clusterLabs.enabled: the workspace and terraform pods run in the cluster" }}{{ end }}
            {{- if and (not .Values.awsLabs.dryRun) (or (not .Values.awsLabs.labRoleArn) (not .Values.awsLabs.opsRoleArn) (not .Values.awsLabs.stateBucket)) }}{{ fail "awsLabs needs labRoleArn, opsRoleArn and stateBucket (the deploy/aws/labs outputs)" }}{{ end }}
            - { name: CRUCIBLE_AWS_LABS, value: {{ ternary "dryrun" "1" .Values.awsLabs.dryRun | quote }} }
            {{- if .Values.awsLabs.dryRun }}
            - { name: CRUCIBLE_INFRACOST, value: "off" }
            {{- end }}
            - { name: CRUCIBLE_AWS_LAB_ROLE_ARN, value: {{ .Values.awsLabs.labRoleArn | quote }} }
            - { name: CRUCIBLE_AWS_OPS_ROLE_ARN, value: {{ .Values.awsLabs.opsRoleArn | quote }} }
            - { name: CRUCIBLE_AWS_STATE_BUCKET, value: {{ .Values.awsLabs.stateBucket | quote }} }
            - { name: CRUCIBLE_AWS_STATE_REGION, value: {{ .Values.awsLabs.stateRegion | default .Values.backup.region | quote }} }
            - { name: CRUCIBLE_AWS_LAB_REGIONS, value: {{ .Values.awsLabs.regions | quote }} }
            - { name: CRUCIBLE_AWS_WORKSPACE_IMAGE, value: {{ .Values.awsLabs.workspaceImage | quote }} }
            - { name: CRUCIBLE_TERRAFORM_IMAGE, value: {{ .Values.awsLabs.terraformImage | quote }} }
            - { name: AWS_REGION, value: {{ .Values.backup.region | quote }} }   # STS regional endpoint
            - name: INFRACOST_API_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: INFRACOST_API_KEY, optional: true } }
            {{- end }}
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: git-credentials, mountPath: /etc/crucible/git-credentials, subPath: git-credentials, readOnly: true }
      volumes:
        - name: data
          emptyDir: {}        # git mirrors and exports: rebuilt from git on start
        - name: git-credentials
          secret: { secretName: {{ .Values.secretName }}, items: [{ key: git-credentials, path: git-credentials }] }
---
apiVersion: v1
kind: Service
metadata: { name: crucible }
spec:
  selector: { app: crucible }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: crucible
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: {{ .Values.tls.certResolver }}
spec:
  ingressClassName: traefik
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: crucible, port: { number: 80 } } }
