# Releases from main, driven by pull requests.
#
#   * PR opened / updated against main -> build everything that would ship (three multi-arch images, the chart, the
#     crucible binaries) without pushing; the binaries and the chart are uploaded as workflow artifacts.
#   * PR merged into main              -> git-cliff picks the next version from the conventional commits and the merge
#     commit is tagged with it (nothing is pushed to main: protect-main refuses github-actions); the images are pushed
#     to GHCR with provenance and SBOMs, the chart is pinned to their digests and pushed as an OCI chart, and a GitHub
#     Release carries the binaries, SHA256SUMS and the changelog since the last release as its notes.
#
# Docs-only and ci-only merges release nothing.
#
# The binaries build on their own runner while the images build (go build already uses every core, so they gain nothing
# from sharing one); a small version job goes first so both stamp the same version.
name: release

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

# A PR's runs share a group, and a new push cancels its in-flight test build. Merges share one group instead, and are
# never cancelled: two merges in a row release one after the other, in order, so each sees the tag before it.
concurrency:
  group: ${{ (github.event.action == 'closed' && github.event.pull_request.merged) && 'release-main' || format('release-pr-{0}', github.event.pull_request.number) }}
  # GitHub keeps one pending run per group: a third merge in quick succession replaces the second, whose commits then
  # ship in the third's release.
  cancel-in-progress: ${{ github.event.action != 'closed' || !github.event.pull_request.merged }}

permissions:
  contents: read

env:
  GIT_CLIFF_VERSION: "2.13.1"
  # The release's published git-cliff-2.13.1-x86_64-unknown-linux-gnu.tar.gz.sha512 asset.
  GIT_CLIFF_SHA512: e716cce3a07dda41b1e370d6afbd7a59eb3d4739509fb7856aeec8da2be28c0396584e29e106141c1a1c535c1827dbc1f60417524f5cfb1da9e11f700bd00f30
  HELM_VERSION: v3.18.4
  # Fixed names (GHCR wants lowercase; the org's name is not derived from github.repository).
  SERVER_IMAGE: ghcr.io/platform-infra-org/crucible
  WORKSPACE_IMAGE: ghcr.io/platform-infra-org/crucible-workspace
  TOOLBOX_IMAGE: ghcr.io/platform-infra-org/crucible-toolbox
  CHART_REPO: oci://ghcr.io/platform-infra-org/charts

jobs:
  # ------------------------------------------------------------------ open / update
  test-version:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags so git-cliff sees them

      - name: Install git-cliff
        run: |
          f="git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfLo "$RUNNER_TEMP/$f" "https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/$f"
          echo "${GIT_CLIFF_SHA512}  $RUNNER_TEMP/$f" | sha512sum -c -
          tar xzf "$RUNNER_TEMP/$f" --strip-components=1 -C /usr/local/bin "git-cliff-${GIT_CLIFF_VERSION}/git-cliff"

      - name: Compute the next (bumped) version
        id: ver
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # The -pr.<n> marker keeps a test build from colliding with a real release.
          base="$(git-cliff --config cliff.toml --bumped-version)"
          version="v${base#v}-pr.${PR_NUMBER}"
          if ! [[ $version =~ ^v[0-9]+\.[0-9]+\.[0-9]+-pr\.[0-9]+$ ]]; then
            echo "::error::Not a test-build version: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test-build:
    needs: test-version
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: .local/tools
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/tools.sh') }}

      - name: Install pinned tools
        run: |
          make tools
          echo "$PWD/.local/tools/go/bin" >> "$GITHUB_PATH"
          echo "$PWD/.local/tools" >> "$GITHUB_PATH"

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Build only: nothing is pushed from a PR.
      - name: Build the server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: CRUCIBLE_VERSION=${{ needs.test-version.outputs.version }}
          tags: ${{ env.SERVER_IMAGE }}:${{ needs.test-version.outputs.version }}

      - name: Build the workspace image
        uses: docker/build-push-action@v6
        with:
          context: deploy/workspace
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ env.WORKSPACE_IMAGE }}:${{ needs.test-version.outputs.version }}

      - name: Build the toolbox image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/toolbox/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ env.TOOLBOX_IMAGE }}:${{ needs.test-version.outputs.version }}

      - name: Package the chart
        env:
          VERSION: ${{ needs.test-version.outputs.version }}
        run: helm package deploy/helm/crucible --version "${VERSION#v}" --app-version "$VERSION" -d dist

      - name: Upload the chart
        uses: actions/upload-artifact@v4
        with:
          name: crucible-${{ needs.test-version.outputs.version }}-chart
          path: dist/
          if-no-files-found: error

  test-binaries:
    needs: test-version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: .local/tools
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/tools.sh') }}

      - name: Install pinned tools
        run: |
          make tools
          echo "$PWD/.local/tools/go/bin" >> "$GITHUB_PATH"
          echo "$PWD/.local/tools" >> "$GITHUB_PATH"

      - name: Build the binaries
        env:
          VERSION: ${{ needs.test-version.outputs.version }}
        run: scripts/release-binaries.sh "$VERSION" dist

      - name: Upload the binaries
        uses: actions/upload-artifact@v4
        with:
          name: crucible-${{ needs.test-version.outputs.version }}-binaries
          path: dist/
          if-no-files-found: error

  # ------------------------------------------------------------------ merge
  # No actions/cache in any merge job: a cache any PR run can save must never reach a job that can write (lint-workflows.sh
  # enforces that), nor a job whose output is published, like binaries (keep it so by hand).
  version:
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the tag
    outputs:
      version: ${{ steps.ver.outputs.version }}
      previous: ${{ steps.ver.outputs.previous }}
      release: ${{ steps.ver.outputs.release }}
    steps:
      # The merge commit itself, not main's tip: a later merge may already have landed, and each release is the commit
      # its PR produced. Nothing is pushed to main (protect-main refuses github-actions); only the tag is pushed.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Install git-cliff
        run: |
          f="git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfLo "$RUNNER_TEMP/$f" "https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/$f"
          echo "${GIT_CLIFF_SHA512}  $RUNNER_TEMP/$f" | sha512sum -c -
          tar xzf "$RUNNER_TEMP/$f" --strip-components=1 -C /usr/local/bin "git-cliff-${GIT_CLIFF_VERSION}/git-cliff"

      - name: Compute the release version
        id: ver
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          release_re='^v[0-9]+\.[0-9]+\.[0-9]+$'
          # Prerelease tags (release-manual) never count as the latest release.
          describe() { git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude 'v*-*' "$@" 2>/dev/null; }

          # This merge commit already carries a release tag: a re-run of a run that pushed the tag and then failed.
          # Resume it unless it was published (then a re-run does nothing). tagged=true skips the tag step.
          for t in $(git tag --points-at HEAD); do
            [[ $t =~ $release_re ]] || continue
            # Fail closed: only a 404 means "not published"; any other gh error stops the run.
            if out="$(gh api "repos/${GH_REPO}/releases/tags/$t" 2>&1 >/dev/null)"; then
              echo "::notice::$t is already published; nothing to do."
              printf 'tagged=true\nrelease=false\n' >> "$GITHUB_OUTPUT"
              exit 0
            elif [[ $out != *"HTTP 404"* ]]; then
              echo "::error::Could not check for a published $t: $out"
              exit 1
            fi
            echo "::notice::$t was tagged by this merge's earlier run but never published; resuming it."
            {
              echo "version=$t"
              echo "release=true"
              echo "tagged=true"
              if p="$(describe HEAD^)"; then echo "previous=$p"; fi
            } >> "$GITHUB_OUTPUT"
            exit 0
          done

          latest="$(describe || echo 'v0.0.0')"
          version="$(git-cliff --config cliff.toml --bumped-version)"
          version="v${version#v}"

          # With merge commits, git-cliff can see a releasing change but skip every candidate while bumping, and
          # return the existing tag. Then the bump comes from the PR title (checks.yml enforces it as a
          # conventional commit). Before 1.0.0 a breaking change bumps the minor (cliff.toml's [bump]).
          if [ "$version" = "$latest" ] || git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            IFS=. read -r major minor patch <<< "${latest#v}"
            breaking='^[a-z]+(\([^)]*\))?!:'
            feature='^feat(\([^)]*\))?:'
            if [[ $PR_TITLE =~ $breaking ]]; then
              if [ "$major" -eq 0 ]; then minor=$((minor + 1)); patch=0; else major=$((major + 1)); minor=0; patch=0; fi
            elif [[ $PR_TITLE =~ $feature ]]; then
              minor=$((minor + 1)); patch=0
            else
              patch=$((patch + 1))
            fi
            version="v${major}.${minor}.${patch}"
            echo "::notice::git-cliff returned no bump; derived ${version} from the PR title."
          fi
          if ! [[ $version =~ $release_re ]]; then
            echo "::error::Refusing to release an invalid version: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$latest" != "v0.0.0" ]; then echo "previous=$latest" >> "$GITHUB_OUTPUT"; fi

          # Release only when a version-bumping commit landed since the last release; a docs-only or ci-only merge
          # releases nothing (the artifacts would be byte-identical).
          if [ "$latest" = "v0.0.0" ]; then range="HEAD"; else range="${latest}..HEAD"; fi
          rel='^(feat|fix|perf|refactor|revert|build)(\(.+\))?!?:|^[a-z]+(\(.+\))?!:'
          if git log "$range" --format='%s' | grep -qE "$rel"; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Only non-releasing commits since ${latest}; no release."
          fi

      # Tags are not covered by protect-main, so the job's own token may push one. A tag that already exists (a later
      # merge released first and took this number) stops the run before anything is published.
      - name: Tag the merge commit
        if: steps.ver.outputs.release == 'true' && steps.ver.outputs.tagged != 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::Refusing to overwrite existing tag $VERSION"
            exit 1
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${VERSION}" -m "Release ${VERSION}"
          git push origin "refs/tags/${VERSION}"

  images:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write # push the images and the chart to GHCR
      id-token: write # OIDC for keyless provenance signing
      attestations: write # actions/attest-build-provenance
    outputs:
      server: ${{ steps.server.outputs.digest }}
      workspace: ${{ steps.workspace.outputs.digest }}
      toolbox: ${{ steps.toolbox.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Install pinned tools
        run: |
          make tools
          echo "$PWD/.local/tools/go/bin" >> "$GITHUB_PATH"
          echo "$PWD/.local/tools" >> "$GITHUB_PATH"

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the server image
        id: server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: CRUCIBLE_VERSION=${{ needs.version.outputs.version }}
          tags: ${{ env.SERVER_IMAGE }}:${{ needs.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.event.pull_request.merge_commit_sha }}

      - name: Build and push the workspace image
        id: workspace
        uses: docker/build-push-action@v6
        with:
          context: deploy/workspace
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.WORKSPACE_IMAGE }}:${{ needs.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.event.pull_request.merge_commit_sha }}

      - name: Build and push the toolbox image
        id: toolbox
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/toolbox/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.TOOLBOX_IMAGE }}:${{ needs.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.event.pull_request.merge_commit_sha }}

      - name: SBOM of the server image
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.SERVER_IMAGE }}@${{ steps.server.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom-crucible.cdx.json
          upload-artifact: false

      - name: SBOM of the workspace image
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.WORKSPACE_IMAGE }}@${{ steps.workspace.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom-crucible-workspace.cdx.json
          upload-artifact: false

      - name: SBOM of the toolbox image
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.TOOLBOX_IMAGE }}@${{ steps.toolbox.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom-crucible-toolbox.cdx.json
          upload-artifact: false

      - name: Attest the server image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.SERVER_IMAGE }}
          subject-digest: ${{ steps.server.outputs.digest }}
          push-to-registry: true

      - name: Attest the workspace image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.WORKSPACE_IMAGE }}
          subject-digest: ${{ steps.workspace.outputs.digest }}
          push-to-registry: true

      - name: Attest the toolbox image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.TOOLBOX_IMAGE }}
          subject-digest: ${{ steps.toolbox.outputs.digest }}
          push-to-registry: true

      # The chart in the registry installs exactly these images (values.yaml is edited in the runner only).
      - name: Pin the chart to the digests and push it
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SERVER_REF: ${{ env.SERVER_IMAGE }}@${{ steps.server.outputs.digest }}
          WORKSPACE_REF: ${{ env.WORKSPACE_IMAGE }}@${{ steps.workspace.outputs.digest }}
          TOOLBOX_REF: ${{ env.TOOLBOX_IMAGE }}@${{ steps.toolbox.outputs.digest }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          go run ./scripts/chartpin -values deploy/helm/crucible/values.yaml \
            -server "$SERVER_REF" -workspace "$WORKSPACE_REF" -toolbox "$TOOLBOX_REF"
          helm package deploy/helm/crucible --version "${VERSION#v}" --app-version "$VERSION"
          echo "$GHCR_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm push "crucible-${VERSION#v}.tgz" "$CHART_REPO"

      - name: Upload the SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sboms
          path: sbom-*.cdx.json
          if-no-files-found: error
          overwrite: true

  binaries:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Install pinned tools
        run: |
          make tools
          echo "$PWD/.local/tools/go/bin" >> "$GITHUB_PATH"
          echo "$PWD/.local/tools" >> "$GITHUB_PATH"

      - name: Build the binaries
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: scripts/release-binaries.sh "$VERSION" dist

      - name: Upload the binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/
          if-no-files-found: error
          overwrite: true

  publish:
    needs: [version, images, binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the release
      packages: write # move the latest tags
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Install git-cliff
        run: |
          f="git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfLo "$RUNNER_TEMP/$f" "https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/$f"
          echo "${GIT_CLIFF_SHA512}  $RUNNER_TEMP/$f" | sha512sum -c -
          tar xzf "$RUNNER_TEMP/$f" --strip-components=1 -C /usr/local/bin "git-cliff-${GIT_CLIFF_VERSION}/git-cliff"

      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: sboms

      - name: Write this release's notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PREVIOUS: ${{ needs.version.outputs.previous }}
          SERVER_REF: ${{ env.SERVER_IMAGE }}@${{ needs.images.outputs.server }}
          WORKSPACE_REF: ${{ env.WORKSPACE_IMAGE }}@${{ needs.images.outputs.workspace }}
          TOOLBOX_REF: ${{ env.TOOLBOX_IMAGE }}@${{ needs.images.outputs.toolbox }}
        run: |
          # A range, not --latest: --latest would stop at a prerelease tag merged into main.
          if [ -n "$PREVIOUS" ]; then
            git-cliff --config cliff.toml --strip all -o RELEASE_NOTES.md "${PREVIOUS}..HEAD"
          else
            git-cliff --config cliff.toml --latest --strip all -o RELEASE_NOTES.md
          fi
          {
            echo
            echo "### Images"
            echo
            echo '```'
            echo "$SERVER_REF"
            echo "$WORKSPACE_REF"
            echo "$TOOLBOX_REF"
            echo '```'
            echo
            echo "### Chart"
            echo
            echo '```'
            echo "helm install crucible ${CHART_REPO}/crucible --version ${VERSION#v}"
            echo "crucible aws deploy --version ${VERSION}"
            echo '```'
          } >> RELEASE_NOTES.md

      # A late re-run of an older merge (a newer release is already out) must not move `latest` back to it.
      - name: Is this the newest release?
        id: newest
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git fetch --tags --force --quiet origin
          top="$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
          if [ "$top" = "$VERSION" ]; then echo "newest=true" >> "$GITHUB_OUTPUT"; else
            echo "newest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$top is newer than $VERSION: publishing $VERSION without moving latest."
          fi

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          name: ${{ needs.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          make_latest: ${{ steps.newest.outputs.newest }}
          files: |
            dist/*
            sbom-*.cdx.json

      - uses: docker/setup-buildx-action@v3
        if: steps.newest.outputs.newest == 'true'

      - name: Log in to GHCR
        if: steps.newest.outputs.newest == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Last, so `latest` only ever names images a published chart and release pin.
      - name: Move the latest tags
        if: steps.newest.outputs.newest == 'true'
        env:
          WORKSPACE_REF: ${{ env.WORKSPACE_IMAGE }}@${{ needs.images.outputs.workspace }}
          TOOLBOX_REF: ${{ env.TOOLBOX_IMAGE }}@${{ needs.images.outputs.toolbox }}
        run: |
          docker buildx imagetools create -t "${WORKSPACE_IMAGE}:latest" "$WORKSPACE_REF"
          docker buildx imagetools create -t "${TOOLBOX_IMAGE}:latest" "$TOOLBOX_REF"
