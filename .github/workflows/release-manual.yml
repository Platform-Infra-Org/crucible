# A prerelease from any branch, run by hand (Actions tab -> release-manual -> Run workflow, pick the branch).
#
# The version is <next>-<branch>.<run number> (for example v0.3.0-feat-labs.17) unless overridden; the tag points at
# the branch's HEAD. The same artifacts as a release are published (three images, the pinned chart, the binaries),
# flagged as a prerelease, with no `latest` tags. The binaries build on their own runner while the images build; a small
# version job goes first so both stamp the same version. Every job checks out github.sha, the commit the run started on.
name: release-manual

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (e.g. v1.2.3-rc.1). Leave blank for <next>-<branch>.<run number>."
        required: false
        default: ""

permissions:
  contents: read

env:
  GIT_CLIFF_VERSION: "2.13.1"
  # The release's published git-cliff-2.13.1-x86_64-unknown-linux-gnu.tar.gz.sha512 asset.
  GIT_CLIFF_SHA512: e716cce3a07dda41b1e370d6afbd7a59eb3d4739509fb7856aeec8da2be28c0396584e29e106141c1a1c535c1827dbc1f60417524f5cfb1da9e11f700bd00f30
  HELM_VERSION: v3.18.4
  SERVER_IMAGE: ghcr.io/platform-infra-org/crucible
  WORKSPACE_IMAGE: ghcr.io/platform-infra-org/crucible-workspace
  TOOLBOX_IMAGE: ghcr.io/platform-infra-org/crucible-toolbox
  CHART_REPO: oci://ghcr.io/platform-infra-org/charts

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        run: |
          f="git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfLo "$RUNNER_TEMP/$f" "https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/$f"
          echo "${GIT_CLIFF_SHA512}  $RUNNER_TEMP/$f" | sha512sum -c -
          tar xzf "$RUNNER_TEMP/$f" --strip-components=1 -C /usr/local/bin "git-cliff-${GIT_CLIFF_VERSION}/git-cliff"

      - name: Compute the version
        id: ver
        env:
          OVERRIDE: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          RUN: ${{ github.run_number }}
        run: |
          if [ -n "$OVERRIDE" ]; then
            version="v${OVERRIDE#v}"
          else
            next="$(git-cliff --config cliff.toml --bumped-version)"
            # A semver prerelease identifier allows [0-9A-Za-z-] only.
            branch="$(printf '%s' "$REF_NAME" | tr -c '0-9A-Za-z-' '-' | cut -c1-40)"
            version="v${next#v}-${branch}.${RUN}"
          fi
          # Prereleases only: a plain vX.Y.Z belongs to release.yml.
          if ! [[ $version =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$ ]]; then
            echo "::error::Not a prerelease version (vX.Y.Z-<suffix>): $version"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "::error::Refusing to overwrite existing tag $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # No actions/cache in any job here: a cache any PR run can save must never reach a job that can write, nor a job
  # whose output is published (lint-workflows.sh).
  images:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write # push the images and the chart to GHCR
      id-token: write # OIDC for keyless provenance signing
      attestations: write # actions/attest-build-provenance
    outputs:
      server: ${{ steps.server.outputs.digest }}
      workspace: ${{ steps.workspace.outputs.digest }}
      toolbox: ${{ steps.toolbox.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned tools
        run: |
          make tools
          echo "$PWD/.local/tools/go/bin" >> "$GITHUB_PATH"
          echo "$PWD/.local/tools" >> "$GITHUB_PATH"

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No `latest` tags: a branch build is not the release line.
      - name: Build and push the server image
        id: server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: CRUCIBLE_VERSION=${{ needs.version.outputs.version }}
          tags: ${{ env.SERVER_IMAGE }}:${{ needs.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push the workspace image
        id: workspace
        uses: docker/build-push-action@v6
        with:
          context: deploy/workspace
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.WORKSPACE_IMAGE }}:${{ needs.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push the toolbox image
        id: toolbox
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/toolbox/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.TOOLBOX_IMAGE }}:${{ needs.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: SBOM of the server image
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.SERVER_IMAGE }}@${{ steps.server.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom-crucible.cdx.json
          upload-artifact: false

      - name: SBOM of the workspace image
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.WORKSPACE_IMAGE }}@${{ steps.workspace.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom-crucible-workspace.cdx.json
          upload-artifact: false

      - name: SBOM of the toolbox image
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.TOOLBOX_IMAGE }}@${{ steps.toolbox.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom-crucible-toolbox.cdx.json
          upload-artifact: false

      - name: Attest the server image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.SERVER_IMAGE }}
          subject-digest: ${{ steps.server.outputs.digest }}
          push-to-registry: true

      - name: Attest the workspace image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.WORKSPACE_IMAGE }}
          subject-digest: ${{ steps.workspace.outputs.digest }}
          push-to-registry: true

      - name: Attest the toolbox image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.TOOLBOX_IMAGE }}
          subject-digest: ${{ steps.toolbox.outputs.digest }}
          push-to-registry: true

      - name: Pin the chart to the digests and push it
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SERVER_REF: ${{ env.SERVER_IMAGE }}@${{ steps.server.outputs.digest }}
          WORKSPACE_REF: ${{ env.WORKSPACE_IMAGE }}@${{ steps.workspace.outputs.digest }}
          TOOLBOX_REF: ${{ env.TOOLBOX_IMAGE }}@${{ steps.toolbox.outputs.digest }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          go run ./scripts/chartpin -values deploy/helm/crucible/values.yaml \
            -server "$SERVER_REF" -workspace "$WORKSPACE_REF" -toolbox "$TOOLBOX_REF"
          helm package deploy/helm/crucible --version "${VERSION#v}" --app-version "$VERSION"
          echo "$GHCR_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm push "crucible-${VERSION#v}.tgz" "$CHART_REPO"

      - name: Upload the SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sboms
          path: sbom-*.cdx.json
          if-no-files-found: error

  binaries:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned tools
        run: |
          make tools
          echo "$PWD/.local/tools/go/bin" >> "$GITHUB_PATH"
          echo "$PWD/.local/tools" >> "$GITHUB_PATH"

      - name: Build the binaries
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: scripts/release-binaries.sh "$VERSION" dist

      - name: Upload the binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/
          if-no-files-found: error

  publish:
    needs: [version, images, binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # push the tag, create the release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        run: |
          f="git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfLo "$RUNNER_TEMP/$f" "https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/$f"
          echo "${GIT_CLIFF_SHA512}  $RUNNER_TEMP/$f" | sha512sum -c -
          tar xzf "$RUNNER_TEMP/$f" --strip-components=1 -C /usr/local/bin "git-cliff-${GIT_CLIFF_VERSION}/git-cliff"

      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: sboms

      - name: Generate the release notes (unreleased commits on this branch)
        run: git-cliff --config cliff.toml --unreleased --strip all -o RELEASE_NOTES.md

      - name: Add the images and the chart to the notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SERVER_REF: ${{ env.SERVER_IMAGE }}@${{ needs.images.outputs.server }}
          WORKSPACE_REF: ${{ env.WORKSPACE_IMAGE }}@${{ needs.images.outputs.workspace }}
          TOOLBOX_REF: ${{ env.TOOLBOX_IMAGE }}@${{ needs.images.outputs.toolbox }}
        run: |
          {
            echo
            echo "### Images"
            echo
            echo '```'
            echo "$SERVER_REF"
            echo "$WORKSPACE_REF"
            echo "$TOOLBOX_REF"
            echo '```'
            echo
            echo "### Chart"
            echo
            echo '```'
            echo "helm install crucible ${CHART_REPO}/crucible --version ${VERSION#v}"
            echo "crucible aws deploy --version ${VERSION}"
            echo '```'
          } >> RELEASE_NOTES.md

      # Tagged last, so a re-run after a failed build or push is not refused by an existing tag.
      - name: Tag the branch HEAD
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${VERSION}" -m "Prerelease ${VERSION}"
          git push origin "${VERSION}"

      - name: Create the GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          name: ${{ needs.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          prerelease: true
          files: |
            dist/*
            sbom-*.cdx.json
